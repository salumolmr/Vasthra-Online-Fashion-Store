<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vasthra - Luxury Ethnic Wear</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <h1>Vasthra</h1>
  <div>
    <a href="index.html">Home</a><a href="shop.html">Shop</a>
    <a href="login.html">Login</a><a href="register.html">Register</a>
    <span>❤️ <span id="wishlistCount">0</span></span>
    <span>Cart <span id="cartCount">0</span></span>
  </div>
</nav>

<div class="hero">
  <div>
    <h1>Vasthra</h1>
    <p>Timeless Indian Elegance • Handcrafted with Love</p>
    <button class="btn" onclick="location.href='shop.html'">Shop Collection</button>
  </div>
</div>

<div class="container">
  <h2 style="text-align:center;color:#8B4513;font-size:3rem;margin:80px 0 40px;">New Arrivals</h2>
  <div class="grid" id="newArrivals"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<script src="script.js"></script>
<script>
  db.collection("products").limit(3).onSnapshot( ... );
</script>

<script>
db.collection("products").limit(3).onSnapshot(s => {
  let html = "";
  s.forEach(d => {
    const p = d.data();
    p.id = d.id;

    // 🔹 Fix image path
    let imgPath = p.image || "";
    if (imgPath && !imgPath.startsWith("http") && !imgPath.startsWith("images/")) {
      imgPath = "images/" + imgPath;
    }

    html += `
      <div class="card">
        <img src="${imgPath}" onclick="location.href='product.html?id=${p.id}'">
        <div style="padding:20px;">
          <h3>${p.name}</h3>
          <p style="color:#8B4513;font-weight:bold;">₹${p.price}</p>
        </div>
      </div>`;
  });
  document.getElementById("newArrivals").innerHTML = html;
});

</script>
</body>
</html>
