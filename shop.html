<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shop - Vasthra</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <h1>Vasthra</h1>
  <div>
    <a href="index.html">Home</a><a href="shop.html">Shop</a>
    <a href="profile.html">Profile</a>
    <button class="btn" onclick="toggleCart()">Cart <span id="cartCount">0</span></button>
    <button class="btn" onclick="location.href='wishlist.html'">Wishlist <span id="wishlistCount">0</span></button>
  </div>
</nav>

<div class="container" style="margin-top:100px;">
  <h1 style="text-align:center;color:#8B4513;">Our Collection</h1>
  <div class="grid" id="products"></div>
</div>

<div style="position:fixed;right:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:none;z-index:999;" onclick="toggleCart()"></div>
<div class="cart-sidebar" id="cartSidebarParent"><div id="cartSidebar"></div></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<script src="script.js"></script>

<script>
db.collection("products").onSnapshot(s => {
  let html = "";
  s.forEach(d => {
    const p = d.data();
    p.id = d.id;

    // 🔹 Fix image path:
    // - if it already starts with http or images/, use as-is
    // - else assume it is a filename in /images/ (like saree1.jpg)
    let imgPath = p.image || "";
    if (imgPath && !imgPath.startsWith("http") && !imgPath.startsWith("images/")) {
      imgPath = "images/" + imgPath;
    }

    const inWish = wishlist.some(i => i.id === p.id);

    html += `
      <div class="card">
        <button class="wishlist-btn"
          onclick="toggleWishlist('${p.id}','${p.name}',${p.price},'${imgPath}')">
          ${inWish ? '❤️' : '🤍'}
        </button>
        <img src="${imgPath}" onclick="location.href='product.html?id=${p.id}'">
        <div style="padding:20px;">
          <h3>${p.name}</h3>
          <p style="color:#8B4513;font-weight:bold;">₹${p.price}</p>
          <button class="btn" style="width:100%;margin-top:10px;"
            onclick="addToCart('${p.id}','${p.name}',${p.price})">
            Add to Cart
          </button>
        </div>
      </div>`;
  });

  document.getElementById("products").innerHTML = html;
  loadCartSidebar();
});
</script>

</body>
</html>
